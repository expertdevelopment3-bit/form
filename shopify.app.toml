# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b67bfa225536d6bfa870115370291c9d"
name = "FormCraft"
application_url = "https://YOUR-DOMAIN.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_files,read_metaobject_definitions,read_metaobjects,write_files,write_metaobject_definitions,write_metaobjects"

[auth]
redirect_urls = [
  "https://YOUR-DOMAIN.com/auth/callback",
  "https://YOUR-DOMAIN.com/auth/shopify/callback",
  "https://YOUR-DOMAIN.com/api/auth/callback"
]

[app_proxy]
url = "https://YOUR-DOMAIN.com/api"
subpath = "formcraft"
prefix = "apps"

[metaobjects.app.form]
name = "FormCraft Form"
description = "Storefront form configuration created with FormCraft"

  [metaobjects.app.form.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[metaobjects.app.form.fields.name]
name = "Form Name"
type = "single_line_text_field"
required = true

[metaobjects.app.form.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.form.fields.description]
name = "Description"
type = "multi_line_text_field"

[metaobjects.app.form.fields.fields_config]
name = "Fields Configuration"
type = "json"
required = true

[metaobjects.app.form.fields.submit_label]
name = "Submit Button Label"
type = "single_line_text_field"

[metaobjects.app.form.fields.status]
name = "Status"
type = "single_line_text_field"
required = true

[metaobjects.app.form.fields.success_message]
name = "Success Message"
type = "single_line_text_field"

[metaobjects.app.form_submission]
name = "FormCraft Submission"
description = "Storefront submissions collected by FormCraft"

  [metaobjects.app.form_submission.access]
  admin = "merchant_read_write"

[metaobjects.app.form_submission.fields.form_id]
name = "Form ID"
type = "single_line_text_field"
required = true

[metaobjects.app.form_submission.fields.form_title]
name = "Form Title"
type = "single_line_text_field"

[metaobjects.app.form_submission.fields.customer_name]
name = "Customer Name"
type = "single_line_text_field"

[metaobjects.app.form_submission.fields.customer_email]
name = "Customer Email"
type = "single_line_text_field"

[metaobjects.app.form_submission.fields.message]
name = "Message"
type = "multi_line_text_field"

[metaobjects.app.form_submission.fields.uploaded_file_url]
name = "Uploaded File URL"
type = "url"

[metaobjects.app.form_submission.fields.uploaded_file_name]
name = "Uploaded File Name"
type = "single_line_text_field"

[metaobjects.app.form_submission.fields.submitted_at]
name = "Submitted At"
type = "date_time"
required = true

[metaobjects.app.form_submission.fields.submission_status]
name = "Submission Status"
type = "single_line_text_field"

[metaobjects.app.form_submission.fields.submission_data]
name = "Submission Data"
type = "json"

